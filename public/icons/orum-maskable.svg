<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    Variante maskable. Android recorta el icono con la forma del sistema
    (círculo, squircle, gota), así que todo el contenido vive dentro de la
    "zona segura": el círculo central de radio 40% del lienzo. Sin esta
    variante, el icono normal aparecería recortado por los bordes.
  -->
  <defs>
    <linearGradient id="oroMask" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E3D0A4" />
      <stop offset="38%" stop-color="#BFA063" />
      <stop offset="62%" stop-color="#9E8244" />
      <stop offset="100%" stop-color="#D4BC85" />
    </linearGradient>
  </defs>

  <!-- El fondo cubre el lienzo entero: es lo que el sistema recorta. -->
  <rect width="512" height="512" fill="#0A0A0C" />

  <!-- Anillo más pequeño que en el icono normal, para caber en la zona segura. -->
  <circle cx="256" cy="256" r="100" fill="none" stroke="url(#oroMask)" stroke-width="22" />
</svg>
