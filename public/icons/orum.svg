<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    Icono de ORUM. El wordmark completo es ilegible a 48px, así que el icono
    reduce la marca a su inicial dentro de un anillo: la forma se reconoce
    incluso en la rejilla de aplicaciones del teléfono.
  -->
  <defs>
    <linearGradient id="oro" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E3D0A4" />
      <stop offset="38%" stop-color="#BFA063" />
      <stop offset="62%" stop-color="#9E8244" />
      <stop offset="100%" stop-color="#D4BC85" />
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="#0A0A0C" />

  <!-- Filo de luz superior, como el chaflán de la tarjeta y del cromo. -->
  <path
    d="M112 1.5h288"
    stroke="url(#oro)"
    stroke-width="3"
    stroke-linecap="round"
    opacity="0.5"
    transform="translate(0 1)"
  />

  <circle cx="256" cy="256" r="132" fill="none" stroke="url(#oro)" stroke-width="26" />
</svg>
